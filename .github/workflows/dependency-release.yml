name: Release dependency updates

on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
    branches: ['dependabot/**']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Dependabot pull request Build APK run ID (also used to retry)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       contains(fromJSON('["success", "failure", "timed_out"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Serialize notices for a failed branch separately from merges and tag allocation.
    concurrency:
      group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('dependency-notice-{0}', github.event.workflow_run.head_branch) || 'dependency-release' }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Never check out or execute the PR's code with this write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Release verified dependency update or notify PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          SIGNING_READY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        run: python3 .github/scripts/dependency_release.py
