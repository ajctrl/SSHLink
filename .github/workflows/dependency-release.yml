name: Release dependency updates

on:
  workflow_run:
    workflows: [Build APK]
    types: [completed]
    branches: ['dependabot/**']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Dependabot pull request Build APK run ID (also used to retry)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Failed/skipped builds do not enter the merge and version allocation queue.
    concurrency:
      group: dependency-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # Never check out or execute the PR's code with this write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge verified dependency update and dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
          SIGNING_READY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && secrets.SIGNING_KEY_ALIAS != '' && secrets.SIGNING_STORE_PASSWORD != '' && secrets.SIGNING_KEY_PASSWORD != '' }}
        run: python3 .github/scripts/dependency_release.py
