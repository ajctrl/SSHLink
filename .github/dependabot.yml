version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: '0 4 * * *'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'build(deps)'
    groups:
      gradle-dependencies:
        patterns: ['*']
      gradle-security:
        applies-to: security-updates
        patterns: ['*']
