version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: cron
      cronjob: '0 4 * * *'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'build(deps)'
    groups:
      build-tools:
        patterns: ['com.android.*']
      test-libraries:
        patterns: ['junit:*', 'org.json:*', 'org.robolectric:*']
      app-libraries:
        patterns: ['*']
      gradle-security:
        applies-to: security-updates
        patterns: ['*']
